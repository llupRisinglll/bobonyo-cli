name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install
        run: bun install --frozen-lockfile

      # Every commit with source/build changes must carry a change set
      # (AGENTS.md rule); malformed entries are rejected here too.
      - name: Require a change set
        if: github.event_name == 'pull_request'
        run: node scripts/release.mjs --require-changeset "origin/${{ github.base_ref }}"

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build
